version: "3.9"

services:

  web:

    build: .

    ports:
      - "5000:5000"

    env_file:
      - .env

    depends_on:
      - db

  db:

    image: postgres:16

    environment:
      POSTGRES_DB: dockerdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:

  postgres_data: